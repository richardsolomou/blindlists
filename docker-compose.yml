services:
  sealed-lists:
    build:
      context: .
    restart: unless-stopped
    ports:
      - '3020:3000'
    environment:
      # Public origin of the deployment. Only needed when proxy headers cannot
      # represent it; mutations are rejected from any other origin, and email
      # links are built from it.
      APP_URL: ${APP_URL:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:?Set CENTRIFUGO_API_KEY in .env}
      CENTRIFUGO_PROXY_SECRET: ${CENTRIFUGO_PROXY_SECRET:?Set CENTRIFUGO_PROXY_SECRET in .env}
      CENTRIFUGO_URL: http://centrifugo:8000
      # Leave the mail settings empty and the app simply sends no email.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Each provider appears on the sign-in page only when both halves are set.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
    volumes:
      # The SQLite database holding every game and sealed list.
      - ${DATA_HOST_DIR:-./sealed-lists-data}:/data
    depends_on:
      - centrifugo

  centrifugo:
    image: centrifugo/centrifugo:v6.9.1
    restart: unless-stopped
    command: centrifugo --config=/centrifugo/config.json
    environment:
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: ${APP_URL:-}
      CENTRIFUGO_CLIENT_PROXY_CONNECT_ENDPOINT: ${CENTRIFUGO_CONNECT_URL:-http://sealed-lists:3000/api/centrifugo/connect}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:?Set CENTRIFUGO_API_KEY in .env}
      CENTRIFUGO_VAR_PROXY_SECRET: ${CENTRIFUGO_PROXY_SECRET:?Set CENTRIFUGO_PROXY_SECRET in .env}
    volumes:
      - ./centrifugo.json:/centrifugo/config.json:ro
    ports:
      - 127.0.0.1:${CENTRIFUGO_PORT:-8000}:8000
    extra_hosts:
      - host.docker.internal:host-gateway
