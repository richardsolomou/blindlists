services:
  blindlists:
    build:
      context: .
    restart: unless-stopped
    ports:
      - '3020:3000'
    environment:
      # Public origin of the deployment. Only needed when proxy headers cannot
      # represent it; mutations are rejected from any other origin.
      APP_URL: ${APP_URL:-}
    volumes:
      # The SQLite database holding every game and sealed list.
      - ${DATA_HOST_DIR:-./blindlists-data}:/data
