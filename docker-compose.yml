services:
  sealedlists:
    build:
      context: .
    restart: unless-stopped
    ports:
      - '3020:3000'
    environment:
      # Public origin of the deployment. Only needed when proxy headers cannot
      # represent it; mutations are rejected from any other origin, and email
      # links are built from it.
      APP_URL: ${APP_URL:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      # Leave the mail settings empty and the app simply sends no email.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Each provider appears on the sign-in page only when both halves are set.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
    volumes:
      # The SQLite database holding every game and sealed list.
      - ${DATA_HOST_DIR:-./sealedlists-data}:/data
