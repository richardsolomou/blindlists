name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable && corepack prepare pnpm@11.15.0 --activate
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run independent checks
        run: |
          set -euo pipefail
          pids=()
          pnpm format:check & pids+=("$!")
          pnpm lint & pids+=("$!")
          pnpm db:check & pids+=("$!")
          pnpm build & pids+=("$!")
          pnpm test & pids+=("$!")
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"
      # The build generates src/routeTree.gen.ts, which typecheck needs.
      - run: pnpm typecheck

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
